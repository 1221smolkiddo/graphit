name: Verify Graphit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['22.17.0']
        include:
          - os: windows-latest
            node: '22.23.2'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
        env:
          # A supported release must use prebuilds, even on runners with C++ tools.
          NODE_GYP_FORCE_PYTHON: graphit-prebuild-required-no-python
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm pack
      - run: npm run audit:pack
      # Installs normally into a generated temporary prefix, then verifies CLI,
      # Tree-sitter/native SQLite, encrypted roundtrip and real MCP stdio restart.
      - run: npm run verify:packed
